<style>
*{box-sizing:border-box}
body{
    margin:0;
    font-family:Tahoma,Arial,sans-serif;
    background:#07110b;
    color:#fff;
}
header{
    position:sticky;
    top:0;
    z-index:20;
    background:rgba(5,15,9,.96);
    border-bottom:1px solid #214d2d;
    padding:15px;
}
.logo{
    font-size:25px;
    font-weight:bold;
    color:#62ff82;
    text-align:center;
    margin-bottom:12px;
}
.subtitle{
    text-align:center;
    color:#9eb5a4;
    font-size:12px;
    margin-bottom:14px;
}
.search{
    width:100%;
    border:none;
    outline:none;
    border-radius:14px;
    padding:13px;
    background:#101e15;
    color:white;
    font-size:15px;
}
.tabs{
    display:flex;
    gap:8px;
    margin-top:10px;
}
.tab{
    flex:1;
    padding:12px 5px;
    border:none;
    border-radius:12px;
    color:#fff;
    background:#132219;
    font-weight:bold;
}
.tab.active{
    background:#2b9d49;
}
.container{
    padding:15px;
    max-width:900px;
    margin:auto;
}
.info{
    background:linear-gradient(135deg,#102b18,#0c1710);
    border:1px solid #245f34;
    border-radius:18px;
    padding:15px;
    margin-bottom:15px;
}
.info h2{
    margin:0 0 8px;
    color:#7cff98;
}
.info p{
    margin:0;
    color:#b6c7bb;
    font-size:13px;
    line-height:1.8;
}
.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}
.card{
    background:#0d1911;
    border:1px solid #1e3c27;
    border-radius:17px;
    padding:13px;
    min-height:190px;
    display:flex;
    flex-direction:column;
}
.icon{
    width:48px;
    height:48px;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    background:#173820;
    margin-bottom:10px;
}
.name{
    font-weight:bold;
    font-size:15px;
    margin-bottom:6px;
}
.desc{
    color:#9cad9f;
    font-size:11px;
    line-height:1.7;
    flex:1;
}
.badge{
    display:inline-block;
    width:max-content;
    margin:8px 0;
    padding:4px 7px;
    border-radius:7px;
    font-size:9px;
    background:#162c1d;
    color:#70ff91;
}
.download{
    border:0;
    border-radius:11px;
    padding:10px;
    background:#2b9d49;
    color:white;
    font-weight:bold;
    text-decoration:none;
    text-align:center;
    font-size:12px;
}
.download:active{
    transform:scale(.97);
}
.empty{
    text-align:center;
    color:#9aaa9e;
    padding:40px 10px;
    display:none;
}
footer{
    text-align:center;
    color:#66766b;
    font-size:11px;
    padding:25px 10px;
}
@media(max-width:420px){
    .grid{grid-template-columns:1fr}
}
</style>

    <div class="tabs">

/* =========================
   STATE
   ========================= */

let mode = "java";


function setMode(newMode){

    mode = newMode;

    document.getElementById("javaTab")
        .classList.toggle("active",mode==="java");

    document.getElementById("bedrockTab")
        .classList.toggle("active",mode==="bedrock");

    if(mode==="java"){
        document.getElementById("title").textContent =
            "مودهای Minecraft Java";

        document.getElementById("description").textContent =
            "مودهای Java را جستجو کن و برای دریافت فایل یا نسخه مناسب وارد صفحه واقعی مود شو.";
    }else{
        document.getElementById("title").textContent =
            "Add-on های Minecraft Bedrock";

        document.getElementById("description").textContent =
            "Add-on های Bedrock را پیدا کن و برای دریافت نسخه واقعی وارد صفحه پروژه شو.";
    }

    document.getElementById("search").value="";

    render();
}


/* =========================
   URL GENERATOR
   ========================= */

function getURL(mod){

    const name = mod[0];
    const slug = mod[1];
    const source = mod[4];

    if(source === "Modrinth"){

        return "https://modrinth.com/mod/" + slug;

    }

    if(source === "CurseForge"){

        return "https://www.curseforge.com/minecraft-bedrock/search?class=addons&search=" +
            encodeURIComponent(name);

    }

    return "#";
}


/* =========================
   RENDER
   ========================= */

function render(){

    const grid = document.getElementById("grid");
    const empty = document.getElementById("empty");

    const search =
        document.getElementById("search")
        .value
        .trim()
        .toLowerCase();

    const list =
        mode === "java"
        ? javaMods
        : bedrockMods;

    grid.innerHTML="";

    let count=0;

    list.forEach(mod=>{

        const name = mod[0];
        const desc = mod[3];
        const source = mod[4];

        if(
            search &&
            !name.toLowerCase().includes(search) &&
            !desc.toLowerCase().includes(search)
        ){
            return;
        }

        count++;

        const card=document.createElement("div");
        card.className="card";

        card.innerHTML=`

            <div class="icon">${mod[2]}</div>

            <div class="name">
                ${escapeHTML(name)}
            </div>

            <div class="desc">
                ${escapeHTML(desc)}
            </div>

            <div class="badge">
                ${mode==="java" ? "JAVA" : "BEDROCK"}
                •
                ${source}
            </div>

            <a
                class="download"
                href="${getURL(mod)}"
                target="_blank"
                rel="noopener noreferrer"
            >
                ⬇️ صفحه دانلود
            </a>
        `;

        grid.appendChild(card);
    });

    empty.style.display =
        count === 0
        ? "block"
        : "none";
}


/* =========================
   SECURITY
   ========================= */

function escapeHTML(text){

    return String(text)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* START */

render();
